#
# The phone version: the engine tested against the desktop version, the
# interface checked on the Qt of the APK, and the APK itself. A tag "v*"
# also attaches the APK to the GitHub release of that tag.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64 (the keystore,
# base64), ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_PASSWORD, the APK is signed with that key; without them, with
# the Android debug key (installable, not for publishing). Running this
# workflow accepts the Android SDK licences (--accept-licenses).

name: Mobile

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["mobile/**", "application/psditool/**", "LICENSE.txt", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "application/psditool/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Engine and interface tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # libaom 3.14.1 from source, as in the APK and in Pillow 13: compact
      # archives must then come out identical too.
      - name: Build and differential tests
        run: mobile/scripts/build-desktop.sh --local-avif --test --build build-desktop

      - name: Interface on Qt 6.12 (the APK's)
        run: |
          xvfb-run -a -s "-screen 0 1600x1200x24" env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 \
            build-desktop/venv/bin/python mobile/tests/ui_preview.py build-desktop/ui-preview

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tests-and-screens
          path: |
            build-desktop/test-results/engine/results.json
            build-desktop/tour/
            build-desktop/ui-preview/
          if-no-files-found: ignore

  apk:
    name: APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Qt and tools cache
        uses: actions/cache@v4
        with:
          path: ~/pdft-android-tools
          key: android-tools-qt6.12.0-ndk27.2.12479018-arm64-armv7-x86_64

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PDFT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          PDFT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PDFT_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PDFT_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: mobile/scripts/build-android.sh --accept-licenses --abis "arm64-v8a;armeabi-v7a;x86_64"

      - uses: actions/upload-artifact@v5
        with:
          name: PDFTeleporter-android
          path: mobile/dist/

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/dist/*.apk
            mobile/dist/*.sha256
